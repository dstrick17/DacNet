name: Repro Smoke Test
on:
  push:
    paths:
      - '**/*.py'
      - 'requirements*.txt'
      - 'reproduce.sh'
      - '.github/workflows/repro.yml'
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Run smoke script
        run: |
          bash reproduce.sh
